name: Headless Blender E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'blender_addon/**'
      - 'scripts/headless_bridge_runner.py'
      - 'scripts/blender_healthcheck.py'
      - 'tests/test_bridge_e2e.py'
      - '.github/workflows/headless-e2e.yml'
      - 'requirements.txt'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'blender_addon/**'
      - 'scripts/headless_bridge_runner.py'
      - 'scripts/blender_healthcheck.py'
      - 'tests/test_bridge_e2e.py'
      - '.github/workflows/headless-e2e.yml'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  headless-e2e:
    name: Blender ${{ matrix.blender }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - blender: "4.5.14"
            series: "4.5"
          - blender: "5.2.2"
            series: "5.2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MCP test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .cache/blender-${{ matrix.blender }}-linux-x64
          key: ${{ runner.os }}-blender-${{ matrix.blender }}-linux-x64

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
          BLENDER_SERIES: ${{ matrix.series }}
        run: |
          set -euxo pipefail
          mkdir -p .cache
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl --fail --location --retry 3             "https://download.blender.org/release/Blender${BLENDER_SERIES}/${archive}"             -o ".cache/${archive}"
          tar -xJf ".cache/${archive}" -C .cache
          test -x ".cache/blender-${BLENDER_VERSION}-linux-x64/blender"

      - name: Install addon
        env:
          BLENDER_SERIES: ${{ matrix.series }}
        run: |
          set -euxo pipefail
          addon_dir="$HOME/.config/blender/${BLENDER_SERIES}/scripts/addons"
          mkdir -p "$addon_dir"
          cp blender_addon/openclaw_blender_bridge.py "$addon_dir/openclaw_blender_bridge.py"
          cp blender_addon/new_handlers_phase5.py "$addon_dir/new_handlers_phase5.py"
          cp blender_addon/quality_handlers.py "$addon_dir/quality_handlers.py"
          cp blender_addon/depsgraph_helpers.py "$addon_dir/depsgraph_helpers.py"

      - name: Start persistent headless bridge
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
          OPENCLAW_HOST: 127.0.0.1
          OPENCLAW_PORT: "9876"
        run: |
          set -euxo pipefail
          ".cache/blender-${BLENDER_VERSION}-linux-x64/blender"             --background             --python scripts/headless_bridge_runner.py             > /tmp/openclaw-blender-e2e.log 2>&1 &
          echo $! > /tmp/openclaw-blender-e2e.pid

      - name: Wait for live bridge
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if python scripts/blender_healthcheck.py --live --port 9876; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/openclaw-blender-e2e.pid)" 2>/dev/null; then
              echo "Blender exited before the bridge became healthy"
              cat /tmp/openclaw-blender-e2e.log
              exit 1
            fi
            sleep 1
          done
          echo "Timed out waiting for Blender bridge"
          cat /tmp/openclaw-blender-e2e.log
          exit 1

      - name: Run live canonical E2E
        env:
          BLENDER_E2E: "1"
          BLENDER_HOST: 127.0.0.1
          BLENDER_PORT: "9876"
        run: python -m pytest tests/test_bridge_e2e.py -q

      - name: Show Blender log
        if: always()
        run: cat /tmp/openclaw-blender-e2e.log || true

      - name: Stop Blender
        if: always()
        run: |
          if test -f /tmp/openclaw-blender-e2e.pid; then
            kill "$(cat /tmp/openclaw-blender-e2e.pid)" 2>/dev/null || true
          fi
