name: Headless Blender E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  headless-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Download and Cache Blender
        uses: actions/cache@v4
        id: blender-cache
        with:
          path: blender-4.0.2-linux-x64
          key: ${{ runner.os }}-blender-4.0.2
      - name: Install Blender if not cached
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          wget https://download.blender.org/release/Blender4.0/blender-4.0.2-linux-x64.tar.xz
          tar -xf blender-4.0.2-linux-x64.tar.xz
      - name: Install Addon
        run: |
          mkdir -p ~/.config/blender/4.0/scripts/addons/
          cp blender_addon/openclaw_blender_bridge.py ~/.config/blender/4.0/scripts/addons/
      - name: Run Blender Bridge Headless
        run: |
          ./blender-4.0.2-linux-x64/blender --background --python-expr "import bpy; bpy.ops.preferences.addon_enable(module='openclaw_blender_bridge'); bpy.ops.openclaw.start_server()" &
          sleep 5
      - name: Run E2E Tests
        env:
          BLENDER_E2E: "1"
        run: python -m pytest tests/test_bridge_e2e.py -q
