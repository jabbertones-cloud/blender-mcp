name: Agent OS Live Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

# Release evidence from this workflow is intentionally narrow: it proves the
# bridge can create, mutate, inspect, visually observe, and delete real scene
# state. Legacy LEGO-Eval / BlenderGym adapters are not invoked because their
# current offline/random/fake-task implementations are not trustworthy metrics.

jobs:
  live-agent-os-smoke:
    runs-on: [self-hosted, blender-eval]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned runtime
        run: python -m pip install -r requirements.txt

      - name: Prove Blender bridge is live
        run: python scripts/blender_healthcheck.py --live --port 9876

      - name: Verify observable Blender world-state changes
        run: python scripts/live_agent_os_smoke.py --host 127.0.0.1 --port 9876

      - name: Canonical execute E2E with visual postconditions
        env:
          BLENDER_E2E: "1"
        run: python -m pytest tests/test_bridge_e2e.py -q
