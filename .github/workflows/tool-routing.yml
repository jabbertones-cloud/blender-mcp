name: Tool Routing Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/agent_loop.py'
      - 'server/session_state.py'
      - 'server/capability_router.py'
      - 'server/capability_registry.py'
      - 'server/blender_mcp_guided.py'
      - 'tests/test_capability_router.py'
      - 'tests/test_tool_choice.py'
      - 'tests/test_act_dispatch.py'
      - '.github/workflows/tool-routing.yml'
  push:
    branches: [main]
    paths:
      - 'server/agent_loop.py'
      - 'server/session_state.py'
      - 'server/capability_router.py'
      - 'server/capability_registry.py'
      - 'server/blender_mcp_guided.py'
      - 'tests/test_capability_router.py'
      - 'tests/test_tool_choice.py'
      - 'tests/test_act_dispatch.py'
      - '.github/workflows/tool-routing.yml'
  workflow_dispatch:

jobs:
  router-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest pydantic
      - name: Compile routing modules
        run: >-
          python -m py_compile
          server/capability_router.py
          server/capability_registry.py
          server/session_state.py
          server/agent_loop.py
          server/blender_mcp_guided.py
      - name: Run deterministic router and dispatch floor
        run: python -m pytest tests/test_tool_choice.py tests/test_act_dispatch.py tests/test_capability_router.py -q
