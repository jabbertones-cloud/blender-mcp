name: Tool Routing Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/agent_loop.py'
      - 'server/capability_router.py'
      - 'tests/test_capability_router.py'
      - '.github/workflows/tool-routing.yml'
  push:
    branches: [main]
    paths:
      - 'server/agent_loop.py'
      - 'server/capability_router.py'
      - 'tests/test_capability_router.py'
      - '.github/workflows/tool-routing.yml'
  workflow_dispatch:

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile routing modules
        run: python -m py_compile server/capability_router.py server/agent_loop.py
      - name: Run deterministic routing tests
        run: python -m pytest tests/test_capability_router.py -q
